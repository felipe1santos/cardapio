<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><title>Alarme</title></head>
<body>
<!-- Alarme de pedido novo: janela oculta; o som vem do instalador (nada baixado da internet).
     1.2.2: um som único de 3 s, tocado UMA vez (sem loop). Pedido chegando com o som tocando não toca outro por cima. -->
<audio id="a" src="alarme.mp3" preload="auto"></audio>
<script>
  const a = document.getElementById('a')
  const vol = (v) => Math.max(0.1, Math.min(1, Number(v) || 1))
  window.tocar = (v) => {
    a.volume = vol(v)
    a.loop = false
    if (!a.paused && !a.ended) return Promise.resolve(true)
    a.currentTime = 0
    return a.play().then(() => true, () => false)
  }
  window.volume = (v) => { a.volume = vol(v); return true }
</script>
</body></html>
