<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self'; script-src 'self' 'unsafe-inline'">
<title>Menuzia - desenho da impressao</title>
</head>
<body>
<!-- Janela OCULTA do Assistente Beta (e dos testes): desenha a comanda / pré-conta com o
     ticket-canvas.js — o mesmo da pré-visualização do painel — e devolve o PNG.
     A logo da loja chega como data URL (arquivo local "sujaria" o canvas). -->
<canvas id="t"></canvas>
<script src="../ticket-canvas.js"></script>
<script>
  let fontes = null
  const logos = new Map()
  window.renderizarTicket = async function (doc, opcoes) {
    if (!fontes) fontes = TicketMenuzia.carregarRecursos('../fonts')
    await fontes
    const url = opcoes && opcoes.logo ? String(opcoes.logo) : ''
    if (url && !logos.has(url)) { if (logos.size > 4) logos.clear(); logos.set(url, TicketMenuzia.carregarImagem(url)) }
    const logo = url ? await logos.get(url) : null
    const canvas = document.getElementById('t')
    const r = TicketMenuzia.desenhar(canvas, doc, { ...opcoes, logo })
    return { png: canvas.toDataURL('image/png'), largura: r.largura, altura: r.altura }
  }
</script>
</body>
</html>
