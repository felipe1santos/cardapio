<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; font-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Menuzia - Alfa 1</title>
<style id="fonte">@font-face{font-family:'Comfortaa';src:url('../fonts/Comfortaa-wght.ttf') format('truetype');font-weight:300 700;font-display:block}</style>
<style id="estilo"></style>
</head>
<body>
<!-- Janela OCULTA do Assistente Alfa 1 (alfa1-render.js): recebe o HTML do layout (alfa1.js) e
     a Comfortaa do próprio Assistente; quem captura os pontos é o processo principal. -->
<script>
  window.montarAlfa1 = async function (css, corpo) {
    document.getElementById('estilo').textContent = css
    document.body.innerHTML = corpo
    await document.fonts.load("600 14px Comfortaa")
    await document.fonts.load("700 14px Comfortaa")
    await document.fonts.load("500 14px Comfortaa")
    await document.fonts.ready
    await new Promise((ok) => requestAnimationFrame(() => requestAnimationFrame(ok)))
    const r = document.getElementById('papel').getBoundingClientRect()
    return { altura: r.height, largura: r.width, fonte: document.fonts.check('600 14px Comfortaa') }
  }
</script>
</body>
</html>
